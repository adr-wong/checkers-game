services:

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=checkers
    networks:
      - checkers-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      - PORT=4000
      - ALLOWED_ORIGIN=*
    networks:
      - checkers-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:4000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/checkers
      - AI_SERVICE_URL=http://ai-service:4000
      - AI_REQUEST_TIMEOUT_MS=10000
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - checkers-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.frontend
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - checkers-net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  checkers-net:
    driver: bridge
